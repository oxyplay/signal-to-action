# Threshold alerts, unchanged in spirit from what a customer already runs.
#
# They detect CONDITIONS. Nothing here says whether a condition is harmless
# workload pressure or real degradation, which is the gap the decision layer
# fills. HighCpu deliberately fires in both demo scenarios.
#
# The `for:` windows are short so an alert is visible inside a two minute demo.
# A real deployment would use much longer windows.
groups:
  - name: signal-to-action
    interval: 5s
    rules:
      - alert: HighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 80%"
          description: "CPU is high. Whether that is a problem depends on latency, error rate and request volume."

      - alert: HighHttpLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{route!~"/work|/metrics|/health"}[1m]))) > 2
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "demo-app p95 latency above 2s"

      - alert: HighHttpErrorRate
        expr: sum(rate(http_requests_total{route!~"/work|/metrics|/health",status=~"5.."}[1m])) / sum(rate(http_requests_total{route!~"/work|/metrics|/health"}[1m])) > 0.05
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "demo-app more than 5% of requests failing"
