global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules/alerts.yml"

scrape_configs:
  # The demo workload. Its /metrics endpoint carries the application signals the
  # decision layer reads.
  - job_name: "demo-app"
    static_configs:
      - targets: ["demo-app:3000"]

  # Host and container infrastructure. This is the CPU signal in the demo.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
